        - paragraph [ref=f7e369]: How it started
        - paragraph [ref=f7e371]: "\"We were two friends who couldn't agree on a coffee shop. One wanted better coffee, the other wanted a room you didn't have to leave. So we rented a corner unit on Press Lane, bought a roaster too big for the space, and opened the doors before the sign was finished. Six years later, the sign is still crooked. The coffee is better.\""
